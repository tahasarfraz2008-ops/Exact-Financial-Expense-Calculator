[project]
name = "exact-financial-engine"
version = "1.0.0"
description = "A lossless, rational-arithmetic financial calculation engine for banking applications."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["tests/"]

[tool.coverage.run]
source = ["app"]
